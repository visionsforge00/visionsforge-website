[build]
  publish = "."

# --- Redirects: force https + www on every request (fixes GSC "Page with redirect") ---
[[redirects]]
  from = "http://visionsforge.in/*"
  to = "https://www.visionsforge.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://visionsforge.in/*"
  to = "https://www.visionsforge.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.visionsforge.in/*"
  to = "https://www.visionsforge.in/:splat"
  status = 301
  force = true

# --- Security + caching headers (helps Core Web Vitals -> SEO ranking signal) ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
